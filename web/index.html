<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Book of Long Looks — artmat</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-state="closed">

<!-- Atmosphere only: an overexposed empty room, generated. Nothing here is an
     image, so the page weighs what its text weighs. -->
<canvas id="air" aria-hidden="true"></canvas>

<!-- The book floats while it is closed, because a closed book is an invitation
     and an invitation should be an object. It stops floating the moment it
     opens: from then on it is a surface you write on, and a surface that
     bobs is a surface you cannot use. -->
<div id="stage">
  <div id="book">
    <div id="cover" role="button" tabindex="0"
         aria-label="Open the book">
      <span class="emboss">the book of<br>long looks</span>
    </div>

    <div id="spread" aria-hidden="true">
      <div class="page left">
        <div class="page-inner">
          <form id="ask" autocomplete="off">
            <label for="q" class="sr">Your question</label>
            <input id="q" type="text" maxlength="2000"
                   placeholder="write your question here">
            <button type="submit" id="go" aria-label="Let the ink sink">↓</button>
          </form>

          <p id="rewrite" hidden></p>

          <ul id="examples">
            <li><button type="button">will my cast resin sculpture go yellow outdoors</button></li>
            <li><button type="button">how long can I work with the silicone before it sets</button></li>
            <li><button type="button">cast aluminium or stainless steel for a piece by the sea</button></li>
          </ul>

          <!-- The retrieved passages, pasted in like slips in a research
               notebook. Each is written in the ink of its own source, and the
               ink is aged by how long that source has been watching. -->
          <div id="slips"></div>
        </div>
      </div>

      <div class="page right">
        <div class="page-inner">
          <article id="answer"></article>
          <p id="meta" hidden></p>
          <p id="error" hidden></p>
        </div>
      </div>

      <div id="gutter" aria-hidden="true"></div>
    </div>
  </div>
</div>

<p id="hint">click the book</p>

<script src="app.js"></script>
</body>
</html>
