# Every service is pinned to a patch version. `:latest` would make this file a
# description of what ran on the author's laptop on one particular day, which
# is the opposite of what a reproducibility section is for.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"   # REST + dashboard at /dashboard
      - "6334:6334"   # gRPC, used by qdrant-client
    volumes:
      - qdrant_storage:/qdrant/storage
    # Explicitly disabled, and this needs the explanation it originally got
    # wrong. Defining no healthcheck in compose does not mean the container has
    # none: the qdrant image ships its own, `exec 3<>/dev/tcp/127.0.0.1/6333`,
    # which requires bash. The image has no bash -- its `sh` is dash, which has
    # no /dev/tcp -- so the check fails on every interval and `docker ps` shows
    # a permanently "unhealthy" container that is serving requests normally.
    # It also has no curl and no wget, so there is nothing to replace it with.
    #
    # An always-red health indicator is worse than none: it trains you to
    # ignore the column where a real failure would appear. Readiness is waited
    # for by the client instead -- index.py polls /readyz before writing, which
    # works whether or not compose started the server.
    healthcheck:
      disable: true

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: artmat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artmat}
      POSTGRES_DB: artmat
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artmat -d artmat"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana:12.4.8
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Read by grafana/provisioning/datasources/postgres.yml. Must match the
      # postgres service above; the shell expands the default here, Grafana
      # cannot.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-artmat}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous viewing so a grader can open the dashboard without being
      # handed a password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  qdrant_storage:
  postgres_data:
  grafana_data:
